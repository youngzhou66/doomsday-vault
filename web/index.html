<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>末日电影库 · Doomsday Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f13'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23e0a458' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23e0a458'/%3E%3Cpath d='M16 5v3M16 24v3M5 16h3M24 16h3' stroke='%23e0a458' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="16" r="2.4" fill="currentColor"/><path d="M16 2v5M16 25v5M2 16h5M25 16h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="brand-name">末日电影库</div>
          <div class="brand-sub">DOOMSDAY VAULT · 本地离线</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>

  <aside class="drawer" id="drawer" hidden></aside>
  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toasts" id="toasts"></div>

  <div id="boot-error" hidden style="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;max-width:min(760px,92vw);background:#2a1a1c;border:1px solid #6b3a38;color:#f0b3ae;border-radius:10px;padding:12px 16px;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap"></div>
  <script>
    // 启动兜底：模块加载/初始化失败时不要让用户面对一片空白
    (function () {
      function show(message) {
        var box = document.getElementById('boot-error');
        if (!box) return;
        box.hidden = false;
        box.textContent = '页面启动失败：' + message + '\n请按 F12 查看控制台，或刷新重试。';
      }
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') show('脚本加载失败 ' + (event.target.src || ''));
        else show((event.message || '未知错误') + (event.filename ? '\n' + event.filename + ':' + event.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        show('未捕获的异步错误 ' + (reason && reason.message ? reason.message : String(reason)));
      });
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
